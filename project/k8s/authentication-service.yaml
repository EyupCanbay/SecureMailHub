apiVersion: v1
kind: Secret
metadata:
  name: auth-db-secret
type: Opaque
data:
  POSTGRES_HOST: aG9zdC5taW5pa3ViZS5pbnRlcm5hbA==       # base64(host.minikube.internal)
  POSTGRES_PORT: NTQzMg==                               # base64(5432)
  POSTGRES_USER: cG9zdGdyZXM=                           # base64(postgres)
  POSTGRES_PASSWORD: cGFzc3dvcmQ=                       # base64(password)
  POSTGRES_DB: dXNlcnM=                                 # base64(users)

---

apiVersion: apps/v1
kind: Deployment 
metadata:
  name: authentication-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentication-service
  template:
    metadata:
      labels:
        app: authentication-service
    spec:
      containers:
      - name: authentication-service
        image: "eyupcanbay/auth-service:v1.0.3"
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        env:
          - name: POSTGRES_HOST
            valueFrom:
              secretKeyRef:
                name: auth-db-secret
                key: POSTGRES_HOST
          - name: POSTGRES_PORT
            valueFrom:
              secretKeyRef:
                name: auth-db-secret
                key: POSTGRES_PORT
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: auth-db-secret
                key: POSTGRES_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: auth-db-secret
                key: POSTGRES_PASSWORD
          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: auth-db-secret
                key: POSTGRES_DB
          - name: DSN
            value: "host=$(POSTGRES_HOST) port=$(POSTGRES_PORT) user=$(POSTGRES_USER) password=$(POSTGRES_PASSWORD) dbname=$(POSTGRES_DB) sslmode=disable timezone=UTC connect_timeout=5"

        ports: 
          - containerPort: 80
        readinessProbe:
          httpGet:
            path: /healthz      
            port: 80
          initialDelaySeconds: 5  
          periodSeconds: 5      
        
        livenessProbe:
          httpGet:
            path: /healthz     
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 20    
---
apiVersion: v1
kind: Service 
metadata:
  name: authentication-service
spec:
  selector:
    app: authentication-service
  ports: 
    - protocol: TCP
      name: main-port
      port: 80
      targetPort: 80
