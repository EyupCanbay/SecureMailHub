apiVersion: apps/v1
kind: Deployment 
metadata:
  name: listener-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: listener-service
  template:
    metadata:
      labels:
        app: listener-service
    spec:
      containers:
      - name: listener-service
        image: "eyupcanbay/listener-service:v1.0.2" 
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        env:
          - name: RABBIT_URL
            value: "amqp://guest:guest@rabbitmq:5672/"
        ports: 
          - containerPort: 80
          - containerPort: 5001
          - containerPort: 50001

---

apiVersion: v1
kind: Service 
metadata:
  name: listener-service
spec:
  selector:
    app: listener-service
  ports: 
    - protocol: TCP
      name: main-port
      port: 80
      targetPort: 80
